name: package

# scripts/package.sh on a macOS runner with UniXNU and uefi-sheng checked out beside
# the device repo (the layout board.toml names). The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID. The Data seed is decrypted from data.dbr.enc
# using DATA_SEED_PASSPHRASE so the images keep the same device installation identity.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["macos-27.3-26C5035r", "27", "26", "17"]
        default: "macos-27.3-26C5035r"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      UNIXNU_IPSW_JOBS: 16
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: patch uefi-sheng DRAM bank 1 low cap (0x39C00000)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("uefi-sheng/Platforms/Xiaomi/shengPkg/Library/MemoryMapLib/MemoryMapLib.c")
          src = p.read_text()
          old1 = '{"DRAM bank 1 low", 0x880000000, 0x3B300000, AddMem, SYS_MEM, SYS_MEM_CAP, Conv, WRITE_BACK_XN},'
          new1 = '{"DRAM bank 1 low", 0x880000000, 0x39C00000, AddMem, SYS_MEM, SYS_MEM_CAP, Conv, WRITE_BACK_XN},'
          assert old1 in src, "expected DRAM bank 1 low entry not found in MemoryMapLib.c"
          src = src.replace(old1, new1, 1)
          old2 = 'if (!ShengCut (Free, &FreeCount, (SHENG_RAM_RANGE){0xd0000000, 0xd0010000}) ||'
          new2 = 'if (!ShengCut (Free, &FreeCount, (SHENG_RAM_RANGE){0xd0000000, 0xd0010000}) ||\n      !ShengCut (Free, &FreeCount, (SHENG_RAM_RANGE){0x8b9c00000ULL, 0x8c0000000ULL}) ||'
          assert old2 in src, "expected ShengCut entry not found in MemoryMapLib.c"
          src = src.replace(old2, new2, 1)
          p.write_text(src)
          print("Patched MemoryMapLib.c fallback and live cap to 0x8B9C00000")
          PY
      - name: restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          key: sheng-pkg-${{ inputs.os }}-build-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sheng-pkg-${{ inputs.os }}-build-v1-${{ runner.os }}-
          path: |
            UniXNU/out/feeds
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
            ~/.cache/pip
            ~/.cargo/registry
            ~/.cargo/git
      - name: refresh pinned translator checkout
        if: inputs.os == 'macos-27.3-26C5035r'
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, shutil, subprocess
          from pathlib import Path
          core = Path('UniXNU')
          pin = json.loads((core / 'scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']['commit']
          source = core / 'out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference/metal2vulkan'
          signature = hashlib.sha256((pin + '\n').encode() + (core / 'scripts/build-adreno-metal-bridge.py').read_bytes() + b''.join(path.read_bytes() for path in sorted((core / 'drivers/AdrenoMetal/bridge/patches').glob('*.patch')))).hexdigest()
          stamp = source.with_name('unixnu-translator-patch.sha256')
          if source.exists():
              actual = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pin or not stamp.exists() or stamp.read_text().strip() != signature:
                  shutil.rmtree(source)
          stamp.parent.mkdir(parents=True, exist_ok=True)
          stamp.write_text(signature + '\n')
          PYTHON
      - name: enable metal bridge reuse when unchanged
        if: inputs.os == 'macos-27.3-26C5035r'
        run: |
          python3 - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          runtime = Path('UniXNU/scripts/build-boot-runtime.py')
          src = runtime.read_text()
          old = "script('build-adreno-metal-plugin.py', '--target', target, '--no-replay')"
          new = "script('build-adreno-metal-plugin.py', '--target', target, '--no-replay', '--reuse-bridge')"
          if new not in src:
              assert old in src, 'expected build-adreno-metal-plugin call not found in build-boot-runtime.py'
              runtime.write_text(src.replace(old, new, 1))
              print('Enabled --reuse-bridge in UniXNU/scripts/build-boot-runtime.py')
          meta = Path('UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge/macos27/libadreno_metal_bridge.a.json')
          if meta.is_file():
              prev = json.loads(meta.read_text()).get('identity', {}).get('component', '')
              if prev:
                  repo = 'UniXNU/drivers/AdrenoMetal'
                  has_obj = subprocess.run(['git', '-C', repo, 'cat-file', '-e', prev + ':bridge'], capture_output=True).returncode == 0
                  if not has_obj:
                      r = subprocess.run(['git', '-C', repo, 'fetch', '--depth=1', 'origin', prev], capture_output=True, text=True)
                      if r.returncode != 0:
                          subprocess.run(['git', '-C', repo, 'fetch', '--unshallow'], check=False)
          PYTHON
      - name: tools
        run: |
          brew install dtc llvm lld llvm@22 lld@22 cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup unifdef openssl@3 zstd blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          python3 - <<'PYTHON'
          from pathlib import Path
          toolchain = Path('uefi-toolchain').resolve()
          toolchain.mkdir(exist_ok=True)
          for name in ('clang', 'llvm-lib', 'llvm-rc', 'lld-link'):
              package = 'lld@22' if name == 'lld-link' else 'llvm@22'
              target = toolchain / name
              if not target.exists():
                  target.symlink_to(Path('/opt/homebrew/opt') / package / 'bin' / name)
          with Path(__import__('os').environ['GITHUB_ENV']).open('a') as output:
              output.write('CLANG_BIN=' + str(toolchain) + '/\n')
          PYTHON
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw unifdef zstd; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: identify kernel sdk cache
        id: kernel-sdk
        if: inputs.os == 'macos-27.3-26C5035r'
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, subprocess
          from pathlib import Path
          version = subprocess.check_output(['xcodebuild', '-version']) + subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'])
          key = 'sheng-pkg-macos27-kernel-v1-' + hashlib.sha256(version).hexdigest()[:16]
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('key=' + key + '\n')
          PYTHON
      - name: restore kernel cache
        id: kernel-cache
        if: inputs.os == 'macos-27.3-26C5035r'
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.kernel-sdk.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ steps.kernel-sdk.outputs.key }}-
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/xnu-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/fakeroot
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: decrypt data seed
        env:
          DATA_SEED_PASSPHRASE: ${{ secrets.DATA_SEED_PASSPHRASE }}
        run: |
          if [ -z "$DATA_SEED_PASSPHRASE" ]; then
            echo 'DATA_SEED_PASSPHRASE secret is not set' >&2
            exit 1
          fi
          OPENSSL_BIN="/opt/homebrew/opt/openssl@3/bin/openssl"
          [ -x "$OPENSSL_BIN" ] || OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"
          "$OPENSSL_BIN" enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -in device/data.dbr.enc -out device/data.dbr -pass env:DATA_SEED_PASSPHRASE
          actual="$(shasum -a 256 device/data.dbr | awk '{print $1}')"
          [ "$actual" = "b9c21c8c361b7448ab95e83c9eb8f29dc031ed386f23f93c07c9ac88f3de1614" ] || {
            echo "decrypted data.dbr sha256 mismatch: $actual" >&2
            exit 1
          }
          ls -l device/data.dbr
      - name: bootstrap Ath12kWifi deps
        working-directory: device/drivers/Ath12kWifi
        run: |
          set -euo pipefail
          mkdir -p deps
          if [ ! -d deps/linux/.git ]; then
            git clone --depth 1 --branch v7.0.14 --filter=blob:none --sparse \
              https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git deps/linux
          fi
          git -C deps/linux sparse-checkout set --no-cone \
            drivers/net/wireless/ath/ drivers/bus/mhi/ include/ net/qrtr/ net/mac80211/ net/wireless/ \
            net/core/skbuff.c drivers/soc/qcom/qmi_interface.c drivers/soc/qcom/qmi_encdec.c lib/rbtree.c lib/crypto/arc4.c
          if [ ! -d deps/freebsd/.git ]; then
            git clone --depth 1 --branch releng/15.1 --filter=blob:none --sparse \
              https://github.com/freebsd/freebsd-src.git deps/freebsd
          fi
          git -C deps/freebsd sparse-checkout set --no-cone sys/compat/linuxkpi/ sys/net80211/ sys/sys/
          if [ ! -f deps/wpa_supplicant-2.12.tar.gz ]; then
            curl -fsSL https://w1.fi/releases/wpa_supplicant-2.12.tar.gz -o deps/wpa_supplicant-2.12.tar.gz
          fi
          [ -d deps/wpa_supplicant-2.12 ] || tar -xzf deps/wpa_supplicant-2.12.tar.gz -C deps
          python3 tools/fetch-sources.py --check
      - name: extract proprietary firmware (touch/keyboard/video)
        working-directory: device
        run: python3 scripts/extract-files.py
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          [ -f data.dbr ] && args+=(--data-ramdisk data.dbr)
          scripts/package.sh "${args[@]}"
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 3
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.os }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/logs/
      - name: save build cache
        if: success() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: sheng-pkg-${{ inputs.os }}-build-v1-${{ runner.os }}-${{ github.run_id }}
          path: |
            UniXNU/out/feeds
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
            ~/.cache/pip
            ~/.cargo/registry
            ~/.cargo/git
      - name: save kernel cache
        if: success() && inputs.os == 'macos-27.3-26C5035r' && steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.kernel-sdk.outputs.key }}-${{ github.run_id }}
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/xnu-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/fakeroot
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu
