name: sync-upstream

# 每天把 fork 的 main / feat/macos 同步成上游纯镜像，并把 build 分支 rebase 到上游
# feat/macos 之上（保留我们自己的 CI 提交）。只同步代码，不构建 boot。
on:
  schedule:
    - cron: '17 3 * * *'   # 每天 03:17 UTC（北京时间 11:17）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build
          fetch-depth: 0
      - name: sync from upstream
        env:
          UPSTREAM: https://github.com/UniXNU/UniXNU-sheng.git
        run: |
          set -euo pipefail
          git config user.name  "unixnu-sync-bot"
          git config user.email "unixnu-sync@users.noreply.github.com"
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch upstream --prune --tags --force
          echo "upstream main      = $(git rev-parse upstream/main)"
          echo "upstream feat/macos= $(git rev-parse upstream/feat/macos)"

          # 1) main / feat/macos：纯上游镜像（强制对齐，丢弃本地多余提交）
          for b in main feat/macos; do
            if git ls-remote --exit-code --heads upstream "$b" >/dev/null 2>&1; then
              git checkout -B "$b" "upstream/$b"
              git push --force origin "$b"
            fi
          done

          # 2) build = 上游 main + 我们的 CI 提交（rebase，保持始终基于最新上游）
          git checkout build
          git rebase upstream/main
          git push --force-with-lease origin build
          echo "build rebased onto $(git rev-parse --short upstream/main)"
